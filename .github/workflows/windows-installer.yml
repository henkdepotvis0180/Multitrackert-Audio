name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'multitrack/**'
      - 'requirements*.lock'
      - 'requirements-music.txt'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 make
      - run: windows/build_ffmpeg.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ffmpeg
          path: |
            build/windows-media/bin/
            build/windows-media/source/COPYING.LGPLv2.1
            build/windows-media/FFmpeg-Corresponding-Source.tar.gz
  installer:
    needs: media
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg
          path: build/windows-media
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pyinstaller==6.16.0 pip-licenses==5.0.0
      - run: python scripts/download_models.py
      - run: python scripts/download_test_audio.py
      - run: python scripts/download_music_model.py
      - run: python scripts/download_overlap_model.py
      - name: Version and native media
        id: version
        shell: pwsh
        run: |
          $version = python -c 'from multitrack import __version__; print(__version__)'
          "version=$version" >> $env:GITHUB_OUTPUT
          "MULTITRACK_BUILD_VERSION=$version" >> $env:GITHUB_ENV
          (Resolve-Path 'build/windows-media/bin').Path >> $env:GITHUB_PATH
      - name: Run tests on native Windows
        run: python -m pytest -q
      - name: Retain dependency and runtime notices
        shell: pwsh
        run: |
          python -m piplicenses --format=plain-vertical --with-license-file --no-license-path --with-urls --output-file build/THIRD-PARTY-LICENSES.txt
          $pythonRoot = python -c 'import sys; print(sys.base_prefix)'
          Get-Content (Join-Path $pythonRoot 'LICENSE.txt') | Add-Content build/THIRD-PARTY-LICENSES.txt
      - name: Download signed Microsoft runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile build/vc_redist.x64.exe
          $sig = Get-AuthenticodeSignature build/vc_redist.x64.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'Microsoft runtime signature could not be verified'
          }
      - name: Build self-contained app
        run: python -m PyInstaller --noconfirm --clean windows/app.spec
      - name: Test the actual frozen application
        run: python windows/smoke_test.py dist/MultitrackertAudio/MultitrackertAudio.exe
      - name: Compile the installer
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Test installation, upgrade and data retention
        shell: pwsh
        run: windows/verify_install.ps1 -Installer "artifacts/Multitrackert-Audio-Setup-$env:MULTITRACK_BUILD_VERSION-CPU-x64.exe"
      - name: Release files and checksums
        shell: pwsh
        run: |
          Copy-Item build/windows-media/FFmpeg-Corresponding-Source.tar.gz artifacts/
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            if ($_.Length -gt 2000000000) { throw 'Installer exceeds release asset size limit' }
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification-logs
          path: |
            build/frozen-smoke/*.json
            build/frozen-smoke/*.log
            build/frozen-smoke/data/server.log
            build/frozen-smoke/data/jobs/*/worker.log
            ${{ runner.temp }}/multitrack-install.log
  release:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
      - name: Publish verified Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists; existing installers are never overwritten."
          else
            gh release create "v$VERSION" artifacts/* --target "$GITHUB_SHA" --prerelease \
              --title "Multitrackert Audio $VERSION - Windows CPU" --notes-file windows/release-notes.md
          fi
