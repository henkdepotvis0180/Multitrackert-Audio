[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multitrackert-audio"
version = "0.2.0"
description = "Local-first speaker timelines and experimental overlapping speech separation"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "numpy==2.5.4",
  "scipy==1.18.1", "soundfile==0.14.0", "sherpa-onnx==2.0.1", "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3"]

[project.scripts]
multitrackert = "multitrack.cli:main"

[tool.setuptools.package-data]
multitrack = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: real downloaded models, no mocks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["multitrack*"]
